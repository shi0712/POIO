name: Release POIO

on:
  workflow_dispatch:
    inputs:
      version:
        description: POIO version without the v prefix
        required: true
        type: string
      deploy:
        description: Deploy server and web after publishing assets
        required: true
        default: true
        type: boolean

concurrency:
  group: poio-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./apps/desktop/package.json').version")" = "$VERSION"
          grep -q "versionName = \"$VERSION\"" apps/android/app/build.gradle.kts
          grep -q "version: '$VERSION'" apps/server/src/index.ts
          test -f "docs/release-notes/v$VERSION.md"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: POIO-web
          retention-days: 1
          if-no-files-found: error
          path: apps/web/dist/

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test -w @echodeck/desktop
      - name: Verify native Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'apps/desktop/resources/mumble/mumble.exe',
            'apps/desktop/resources/mumble/plugins/echodeckBridge.dll',
            'apps/desktop/resources/share/poio-share-sidecar.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing native runtime: $path" }
          }
      - name: Build Windows installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build && npx electron-builder --win nsis
      - uses: actions/upload-artifact@v7
        with:
          name: POIO-windows
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            apps/desktop/release/POIO-${{ inputs.version }}-x64-Setup.exe
            apps/desktop/release/POIO-${{ inputs.version }}-x64-Setup.exe.blockmap
            apps/desktop/release/latest.yml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: yes | sdkmanager 'ndk;28.2.13676358'
      - name: Restore compatible Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build signed Android APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Prepare Android release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-android
          apk="release-android/POIO-Android-$VERSION-arm64.apk"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          python3 - "$apk" deploy/download/android-update.json release-android/android-update.json <<'PY'
          import hashlib, json, pathlib, sys
          apk, source, target = map(pathlib.Path, sys.argv[1:])
          metadata = json.loads(source.read_text(encoding='utf-8'))
          payload = apk.read_bytes()
          metadata['sha256'] = hashlib.sha256(payload).hexdigest().upper()
          metadata['size'] = len(payload)
          target.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: POIO-android
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: release-android/

  macos:
    uses: ./.github/workflows/macos-arm64.yml

  publish:
    needs: [validate, windows, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: POIO-windows
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: POIO-android
          path: artifacts/android
      - uses: actions/download-artifact@v7
        with:
          name: POIO-mac-arm64-unsigned
          path: artifacts/macos
      - name: Create or replace GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f \( -name '*.exe' -o -name '*.blockmap' -o -name '*.apk' -o -name '*.dmg' -o -name '*.zip' -o -name 'latest.yml' -o -name 'latest-mac.yml' -o -name 'android-update.json' \) -print | sort)
          test "${#assets[@]}" -ge 8
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "POIO $VERSION" --notes-file "docs/release-notes/v$VERSION.md"
          fi
          cp "docs/release-notes/v$VERSION.md" /tmp/release-notes.md
          {
            printf '\n## SHA-256\n\n'
            for asset in "${assets[@]}"; do
              printf -- '- `%s`: `%s`\n' "$(basename "$asset")" "$(sha256sum "$asset" | cut -d' ' -f1)"
            done
          } >> /tmp/release-notes.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
      - name: Publish stable assets to ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN"
          git lfs install
          git clone "https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/sjw712/POIO.git" modelscope
          win="artifacts/windows/POIO-$VERSION-x64-Setup.exe"
          win_blockmap="$win.blockmap"
          apk="artifacts/android/POIO-Android-$VERSION-arm64.apk"
          dmg="$(find artifacts/macos -type f -name '*.dmg' -print -quit)"
          zip="$(find artifacts/macos -type f -name '*.zip' -print -quit)"
          mac_manifest="$(find artifacts/macos -type f -name 'latest-mac.yml' -print -quit)"
          test -f "$win"; test -f "$win_blockmap"; test -f "$apk"; test -f "$dmg"; test -f "$zip"; test -f "$mac_manifest"
          cp "$win" modelscope/POIO-Windows-latest-x64-Setup.exe
          cp "$win_blockmap" modelscope/POIO-Windows-latest-x64-Setup.exe.blockmap
          cp "$apk" modelscope/POIO-Android-latest-arm64.apk
          cp "$dmg" modelscope/POIO-Mac-latest-arm64.dmg
          cp "$zip" modelscope/POIO-Mac-latest-arm64.zip
          python3 - artifacts/windows/latest.yml modelscope/latest.yml "$VERSION" <<'PY'
          import pathlib, sys
          source, target, version = sys.argv[1:]
          text = pathlib.Path(source).read_text(encoding='utf-8')
          text = text.replace(f'POIO-{version}-x64-Setup.exe.blockmap', 'POIO-Windows-latest-x64-Setup.exe.blockmap')
          text = text.replace(f'POIO-{version}-x64-Setup.exe', 'POIO-Windows-latest-x64-Setup.exe')
          pathlib.Path(target).write_text(text, encoding='utf-8')
          PY
          python3 - "$mac_manifest" modelscope/latest-mac.yml "$(basename "$dmg")" "$(basename "$zip")" <<'PY'
          import pathlib, sys
          source, target, dmg_name, zip_name = sys.argv[1:]
          text = pathlib.Path(source).read_text(encoding='utf-8')
          text = text.replace(dmg_name, 'POIO-Mac-latest-arm64.dmg').replace(zip_name, 'POIO-Mac-latest-arm64.zip')
          pathlib.Path(target).write_text(text, encoding='utf-8')
          PY
          git -C modelscope config user.name 'POIO Release Bot'
          git -C modelscope config user.email 'actions@users.noreply.github.com'
          git -C modelscope add -A -- POIO-Windows-latest-x64-Setup.exe POIO-Windows-latest-x64-Setup.exe.blockmap POIO-Android-latest-arm64.apk POIO-Mac-latest-arm64.dmg POIO-Mac-latest-arm64.zip latest.yml latest-mac.yml
          if ! git -C modelscope diff --cached --quiet; then
            git -C modelscope commit -m "release: publish POIO $VERSION"
            git -C modelscope push
          fi

  deploy:
    if: ${{ inputs.deploy }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: POIO-web
          path: artifacts/web
      - uses: actions/download-artifact@v7
        with:
          name: POIO-android
          path: artifacts/android
      - name: Prepare deployment archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp artifacts/android/android-update.json deploy/download/android-update.json
          tar -czf "/tmp/poio-source-$VERSION.tar.gz" \
            package.json package-lock.json Dockerfile docker-compose.yml vendor/mediasoup-worker apps/server deploy/download
          tar -czf "/tmp/poio-web-$VERSION.tar.gz" -C artifacts/web .
      - name: Configure production SSH key
        env:
          POIO_DEPLOY_KEY: ${{ secrets.POIO_DEPLOY_KEY }}
          POIO_SSH_HOST: ${{ secrets.POIO_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "$POIO_DEPLOY_KEY"; test -n "$POIO_SSH_HOST"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$POIO_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$POIO_SSH_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Deploy server and web
        env:
          VERSION: ${{ inputs.version }}
          POIO_SSH_HOST: ${{ secrets.POIO_SSH_HOST }}
          POIO_SSH_USER: ${{ secrets.POIO_SSH_USER }}
        run: |
          set -euo pipefail
          target="$POIO_SSH_USER@$POIO_SSH_HOST"
          scp "/tmp/poio-source-$VERSION.tar.gz" "/tmp/poio-web-$VERSION.tar.gz" "$target:/tmp/"
          ssh "$target" "bash -s -- '/tmp/poio-source-$VERSION.tar.gz' '/tmp/poio-web-$VERSION.tar.gz' '$VERSION' '$GITHUB_RUN_ID'" < scripts/release/deploy-production.sh

  verify:
    if: ${{ always() && needs.publish.result == 'success' && (inputs.deploy == false || needs.deploy.result == 'success') }}
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production endpoints and stable update manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --insecure https://115.159.222.29/poio/health | grep -q "\"version\":\"$VERSION\""
          curl --fail --silent --show-error --location https://www.modelscope.cn/models/sjw712/POIO/resolve/master/latest.yml | grep -q "version: $VERSION"
          curl --fail --silent --show-error --location https://www.modelscope.cn/models/sjw712/POIO/resolve/master/latest-mac.yml | grep -q "version: $VERSION"
          curl --fail --silent --show-error --location --range 0-0 https://www.modelscope.cn/models/sjw712/POIO/resolve/master/POIO-Android-latest-arm64.apk >/dev/null
